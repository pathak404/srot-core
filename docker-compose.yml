services:
  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - srot_net
    environment:
      NEO4J_AUTH: neo4j/test12345
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    networks:
      - srot_net
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: mysql
    ports:
      - "3309:3306"
    networks:
      - srot_net
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: srot_core
      MYSQL_USER: admin
      MYSQL_PASSWORD: test12345
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file:
      - .env.docker
    networks:
      - srot_net
    container_name: backend
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3309"
      NEO4J_URI: bolt://host.docker.internal:7687
      QDRANT_URL: http://host.docker.internal:6333
    volumes:
      - .:/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_started
      qdrant:
        condition: service_started
    restart: unless-stopped
    

  frontend:
    build: .
    container_name: frontend
    working_dir: /app
    networks:
      - srot_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: http://host.docker.internal:8000
    volumes:
      - .:/app
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend
    env_file:
      - .env.docker
    restart: unless-stopped

volumes:
  neo4j_data:
  qdrant_data:
  mysql_data:


networks:
  srot_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16